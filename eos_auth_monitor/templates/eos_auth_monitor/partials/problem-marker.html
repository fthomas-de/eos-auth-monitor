{% load i18n %}
{# Marks a problem character in a list; a whole red row drowns the text on dark themes. #}
{% if character.problems %}<i class="fas fa-triangle-exclamation text-danger flex-shrink-0 eos-auth-monitor-problem" title="{% translate 'Problems' %}"></i>{% elif character.warnings %}<i class="fas fa-triangle-exclamation text-warning flex-shrink-0 eos-auth-monitor-warning-marker" title="{% translate 'Warnings' %}"></i>{% endif %}
