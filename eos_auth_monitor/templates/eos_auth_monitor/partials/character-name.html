{# The character's name, linked to its corptools Character Audit; plain where corptools is not installed. #}
{% url 'corptools:reactmain' character.id as audit_url %}
{% if audit_url %}
    <a href="{{ audit_url }}" class="text-break">{{ character.name }}</a>
{% else %}
    <span class="text-break">{{ character.name }}</span>
{% endif %}
