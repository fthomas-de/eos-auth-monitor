[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "eos_auth_monitor"
dynamic = ["version", "description"]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    { name = "Flo", email = "xxxeoeoxxx@gmail.com" },
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    # Raise the lower bound once the code relies on something a later 5.x
    # release introduced (a template partial, a bundle, a migration).
    "allianceauth>=5.0,<6",
    # the settings page is a singleton; AA ships django-solo, but we import it
    "django-solo",
]
# corptools, aa-structures, aa-qqbot and aa-discord-telegram-bridge are read
# when installed and are deliberately not dependencies: pip would install
# them - or upgrade the ones a site has pinned.

[project.optional-dependencies]
dev = [
    "coverage",
    "tox",
]

[project.urls]
Homepage = "https://github.com/fthomas-de/eos-auth-monitor"
Source = "https://github.com/fthomas-de/eos-auth-monitor"
Changelog = "https://github.com/fthomas-de/eos-auth-monitor/blob/main/CHANGELOG.md"
Tracker = "https://github.com/fthomas-de/eos-auth-monitor/issues"

[tool.flit.module]
name = "eos_auth_monitor"

[tool.flit.sdist]
exclude = ["testauth", "runtests.py", "tox.ini", ".coveragerc", "docs", "CLAUDE.md"]

[tool.isort]
profile = "black"
multi_line_output = 3
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "DJANGO",
    "ALLIANCEAUTH",
    "FIRSTPARTY",
    "LOCALFOLDER"
]
known_allianceauth = ["allianceauth", "app_utils"]
known_django = ["django", "solo"]

[tool.pylint.'MASTER']
ignore-patterns = ["test_.*.py,__init__.py", "generate_.*.py"]
ignore-paths = ["^.*//migrations//.*$"]

[tool.pylint.'BASIC']
good-names = ["i", "j", "k", "x", "f", "ex"]

[tool.pylint.'FORMAT']
max-line-length = 120

[tool.pylint.'MESSAGES CONTROL']
disable = ["E0213", "E1101", "C0209", "C"]
