# hatchling instead of flit: flit cannot leave the tests out of the wheel
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eos_auth_monitor"
description = "Problem accounts and Corporations of an Alliance, read from other Alliance Auth apps"
dynamic = ["version"]
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    { name = "Flo", email = "xxxeoeoxxx@gmail.com" },
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
    # 5.1.4 is the floor: migration 0002 depends on eveonline 0025, which
    # first ships in 5.1.4 (5.0.0 to 5.1.3 fail at migrate). The code itself
    # needs only 5.0: page-header.html, the DataTables 2 bundles, the
    # sri/evelinks/navactive tags, and django-esi (>=9.0) with
    # ESIClientProvider(operations=...) and .result(use_etag=...). Checked by
    # reading the tags, not by running against 5.1.4.
    "allianceauth>=5.1.4,<6",
    # the settings page is a singleton; AA ships django-solo, but we import it
    "django-solo",
]
# corptools, aa-structures, aa-qqbot and aa-discord-telegram-bridge are read
# when installed and are deliberately not dependencies: pip would install
# them - or upgrade the ones a site has pinned.

[project.optional-dependencies]
# tools/translate.py needs polib; tox and coverage run the suite standalone
dev = [
    "coverage",
    "polib",
    "tox",
]

[project.urls]
Homepage = "https://github.com/fthomas-de/eos-auth-monitor"
Source = "https://github.com/fthomas-de/eos-auth-monitor"
Changelog = "https://github.com/fthomas-de/eos-auth-monitor/blob/main/CHANGELOG.md"
Tracker = "https://github.com/fthomas-de/eos-auth-monitor/issues"

[tool.hatch.version]
path = "eos_auth_monitor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["eos_auth_monitor"]
exclude = ["eos_auth_monitor/tests"]

[tool.hatch.build.targets.sdist]
include = ["/eos_auth_monitor", "/CHANGELOG.md"]
exclude = ["/eos_auth_monitor/tests"]

[tool.isort]
profile = "black"
multi_line_output = 3
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "DJANGO",
    "ALLIANCEAUTH",
    "FIRSTPARTY",
    "LOCALFOLDER"
]
known_allianceauth = ["allianceauth", "app_utils"]
known_django = ["django", "solo"]

[tool.pylint.'MASTER']
ignore-patterns = ["test_.*.py,__init__.py", "generate_.*.py"]
ignore-paths = ["^.*//migrations//.*$"]

[tool.pylint.'BASIC']
good-names = ["i", "j", "k", "x", "f", "ex"]

[tool.pylint.'FORMAT']
max-line-length = 120

[tool.pylint.'MESSAGES CONTROL']
disable = ["E0213", "E1101", "C0209", "C"]
